<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Facebook - Iniciar sesión</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="left">
      <h1>facebook</h1>
      <p>Facebook te ayuda a comunicarte y compartir con las personas que forman parte de tu vida.</p>
    </div>
    <div class="right">
      <form>
        <input type="text" placeholder="Correo electrónico o número de teléfono" />
        <input type="password" placeholder="Contraseña" />
        <button type="submit">Iniciar sesión</button>
        <a href="#">¿Olvidaste tu contraseña?</a>
        <hr />
        <button class="create-account">Crear nueva cuenta</button>
      </form>
    </div>
  </div>
</body>
</html>
