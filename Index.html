<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MiRed - Kaneki</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra superior -->
  <div class="barra-superior">
    <div class="logo">MiRed</div>
    <input type="text" placeholder="Buscar en MiRed..." class="buscador">
    <div class="menu-usuario">
      <span>Mi Perfil</span>
    </div>
  </div>

  <!-- Contenido principal -->
  <div class="contenedor">
    
    <!-- Menú lateral izquierdo -->
    <div class="menu-lateral">
      <ul>
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Amigos</a></li>
        <li><a href="#">Grupos</a></li>
        <li><a href="#">Páginas</a></li>
        <li><a href="#">Marketplace</a></li>
      </ul>
    </div>

    <!-- Feed central -->
    <div class="feed">
      <div class="publicar">
        <textarea placeholder="¿Qué estás pensando?"></textarea>
        <button>Publicar</button>
      </div>

      <div class="publicacion">
        <h3>Manuel Garriazo</h3>
        <p>Estoy feliz con mi nuevo trabajo 🎉</p>
      </div>

      <div class="publicacion">
        <h3>Jorge mejia</h3>
        <p>¿Alguien quiere salir este fin de semana?</p>
      </div>
    </div>

    <!-- Zona lateral derecha (sugerencias, anuncios...) -->
    <div class="zona-derecha">
      <h4>Sugerencias</h4>
      <p>Agrega a Dara E.</p>
      <p>Únete al grupo "Choclito con queso"</p>
    </div>
    <div id="interfaz">
       
    <div id="menu" style="display: none;">
      <h1>Menú</h1>
      <button id="btn-regresar">Regresar a la interfaz</button>
    </div>

  </div>

</body>
</html>
